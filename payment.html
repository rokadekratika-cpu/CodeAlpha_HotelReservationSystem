<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="booking-container">

    <h2>Payment Simulation</h2>

    <form action="PaymentServlet" method="post">

        <input type="text"
               name="cardname"
               placeholder="Card Holder Name"
               required>

        <input type="text"
               name="cardnumber"
               placeholder="Card Number"
               maxlength="16"
               required>

        <input type="text"
               name="cvv"
               placeholder="CVV"
               maxlength="3"
               required>

        <input type="submit"
               value="Pay Now">

    </form>

</div>

</body>
</html>
